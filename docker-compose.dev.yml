version: '3.8'

services:
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc_postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-service
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_URL_DATABASE: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-db
    networks:
      - backend

  core:
    container_name: core
    build:
      context: ./STP_CORE
    env_file:
      - .env
    volumes:
      - ./STP_CORE:/app
      - ./STP_CORE/models:/app/models
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - mongo
      - archiver
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - backend

  archiver:
    container_name: archiver
    build:
      context: ./STP_ETL
    ports:
      - "8080:8080"
    command: go run main.go
    depends_on:
      - mongo
      - minio
    networks:
      - backend

  etl:
    build:
      context: ./STP_SS
    container_name: fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./STP_SS:/app  
    networks:
      - backend

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    networks:
      - backend
  
  stp-postgres:
    image: postgres:15
    container_name: stp-postgres
    restart: always
    environment:
      POSTGRES_DB: stp_ss
      POSTGRES_USER: stp
      POSTGRES_PASSWORD: stp_password
    ports:
      - "5434:5432"  
    volumes:
      - stp_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
  
  # nginx:
  #   image: nginx:latest
  #   container_name: nginx-proxy
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - core
  #     - etl
  #   networks:
  #     - backend
  react-app:
    build: ./STP_client
    ports:
      - "5173:5173" 
    volumes:
      - ./STP_client:/app
      - /app/node_modules
    container_name: stp-client
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  celery-worker:
    build:
      context: ./STP_ETL/celery
      dockerfile: Dockerfile
    container_name: celery-worker
    command: celery -A tasks worker --loglevel=info
    depends_on:
      - redis
    networks:
      - backend

  celery-beat:
    build:
      context: ./STP_ETL/celery
      dockerfile: Dockerfile
    container_name: celery-beat
    command: celery -A tasks beat --loglevel=info
    depends_on:
      - redis
    networks:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - backend

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: always
    ports:
      - "9101:9100"
    networks:
      - backend
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend

  kafka-consumer:
    build:
      context: ./STP_CORE
    depends_on:
      - kafka
    command: python manage.py run_consumer
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KEYCLOAK_REALM=master
      - KEYCLOAK_CLIENT_ID=django
      - KEYCLOAK_CLIENT_SECRET=Fl0ldyHPVK6bblz932a1LDT1UPjbSMS0
    networks:
      - backend

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - backend


volumes:
  mongo_data:
  minio_data:
  kc_postgres_data:
  stp_postgres_data:
  prometheus_data:
  grafana_data:

networks:
  backend:

