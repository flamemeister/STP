version: '3.8'

services:
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc_postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-service
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_URL_DATABASE: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-db
    networks:
      - backend

  core:
    container_name: core
    build:
      context: ./STP_CORE
    volumes:
      - ./STP_CORE:/app
      - ./STP_CORE/models:/app/models
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - mongo
      - archiver
    networks:
      - backend

  archiver:
    container_name: archiver
    build:
      context: ./STP_ETL
    ports:
      - "8080:8080"
    command: go run main.go
    depends_on:
      - mongo
      - minio
    networks:
      - backend

  etl:
    build:
      context: ./STP_SS
    container_name: fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./STP_SS:/app  
    networks:
      - backend

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    networks:
      - backend
  
  stp-postgres:
    image: postgres:15
    container_name: stp-postgres
    restart: always
    environment:
      POSTGRES_DB: stp_ss
      POSTGRES_USER: stp
      POSTGRES_PASSWORD: stp_password
    ports:
      - "5433:5432"  
    volumes:
      - stp_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
  
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - core
      - etl
    networks:
      - backend


volumes:
  mongo_data:
  minio_data:
  kc_postgres_data:
  stp_postgres_data:

networks:
  backend:

