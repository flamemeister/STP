events {}

http {
    include       mime.types;
    default_type  application/json;

    upstream django_upstream {
        server core:8000;
    }

    upstream fastapi_upstream {
        server fastapi:8001;
    }

    upstream archiver_upstream {
    server archiver:8080;
    }


    server {
        listen 80;

        # Django API
        location /api/ {
            proxy_pass http://django_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI 
        location /transport/ {
            proxy_pass http://fastapi_upstream/transport/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Go 
        location /archiver/ {
            proxy_pass http://archiver_upstream/;  
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
