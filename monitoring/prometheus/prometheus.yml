global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'core'
    static_configs:
      - targets: ['core:8000']

  - job_name: 'etl'
    static_configs:
      - targets: ['fastapi:8001']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']


